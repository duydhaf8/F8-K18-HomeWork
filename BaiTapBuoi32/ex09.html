<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Bài 9 - Todo nâng cao</title>
    <style>
        body {
            max-width: 500px;
        }
        .filter-section, .add-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 5px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .btn-done {
            background: yellow;
        }
        .btn-delete {
            background: red;
        }

        .task-name {
            flex-grow: 1;
        }

        .btn-done.completed {
            background-color: green;
            color: white;
        }

    </style>
</head>
<body>

<div class="filter-section">
    <input type="text" id="searchInput" placeholder="Search ">
    <label>
        <input type="checkbox" id="doneCheckbox"> Done tasks only
    </label>
</div>

<div class="add-section">
    <input type="text" id="taskInput" placeholder="Your task">
    <button id="addBtn">Add</button>
</div>

<ul id="taskList"></ul>

<script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const searchInput = document.getElementById('searchInput');
    const doneCheckbox = document.getElementById('doneCheckbox');

    addBtn.addEventListener('click', function() {
        const taskText = taskInput.value.trim();
        if (taskText === '') {
            alert('Invalid input');
            return;
        }

        const li = document.createElement('li');

        const span = document.createElement('span');
        span.textContent = taskText;
        span.className = 'task-name';

        const doneBtn = document.createElement('button');
        doneBtn.textContent = 'Done';
        doneBtn.className = 'btn-done';

        doneBtn.addEventListener('click', function() {
            doneBtn.classList.toggle('completed');
            li.classList.toggle('is-done');
            filterTasks();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'btn-delete';

        deleteBtn.addEventListener('click', function() {
            li.remove();
            filterTasks();
        });

        li.appendChild(span);
        li.appendChild(doneBtn);
        li.appendChild(deleteBtn);

        taskList.appendChild(li);

        taskInput.value = '';

        filterTasks();
    });

    searchInput.addEventListener('input', filterTasks);
    doneCheckbox.addEventListener('change', filterTasks);

    function filterTasks() {
        const searchText = searchInput.value.toLowerCase();
        const isDoneChecked = doneCheckbox.checked;

        const listItems = taskList.querySelectorAll('li');

        listItems.forEach(function(li) {
            const taskName = li.querySelector('.task-name').textContent.toLowerCase();
            const isTaskDone = li.classList.contains('is-done');

            const matchSearch = taskName.includes(searchText);
            const matchCheckbox = isDoneChecked ? isTaskDone : true;

            if (matchSearch && matchCheckbox) {
                li.style.display = 'flex';
            } else {
                li.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
